{% extends 'base.html' %}{% block content %}<h2>{{'Editar' if centro else 'Nuevo'}} centro</h2><form method="post" class="card">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="card-body row g-3">{% if centro %}<div class="col-md-3"><label>Código</label><input class="form-control" value="{{centro.codigo}}" readonly></div>{% endif %}<div class="col-md-6"><label>Nombre</label><input class="form-control" name="nombre" value="{{centro.nombre if centro else ''}}" required></div>{% if centro %}<div class="col-md-3"><label>Estado</label><select class="form-select" name="activo"><option value="1">Activo</option><option value="0" {% if not centro.activo %}selected{% endif %}>Inactivo</option></select></div>{% endif %}<div><button class="btn btn-primary">Guardar</button></div></div></form>{% endblock %}
