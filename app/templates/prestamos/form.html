{% extends 'base.html' %}{% block content %}<h2>Nuevo préstamo</h2><form method="post" class="card"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="card-body row g-3"><div class="col-12"><label class="form-label">Carpeta física</label><input type="hidden" id="carpeta_id" name="carpeta_id" value="{{carpeta_id or ''}}" required><input class="form-control" id="buscarCarpeta" placeholder="Busque por nombre, documento o número de carpeta" autocomplete="off"><div id="resultadosCarpeta" class="list-group mt-1"></div>{% if carpeta_id %}<div class="form-text">Carpeta preseleccionada desde la historia laboral.</div>{% endif %}</div><div class="col-md-5"><label class="form-label">Solicitante</label><input class="form-control" name="solicitante" required></div><div class="col-md-4"><label class="form-label">Área</label><input class="form-control" name="area_solicitante" required></div><div class="col-md-3"><label class="form-label">Devolución prevista</label><input class="form-control" type="date" name="fecha_devolucion_prevista" value="{{fecha_sugerida}}" required></div><div class="col-12"><label class="form-label">Motivo</label><input class="form-control" name="motivo" required></div><div class="col-12"><label class="form-label">Observaciones</label><textarea class="form-control" name="observaciones_salida"></textarea></div><div class="col-12"><button class="btn btn-primary">Registrar préstamo</button></div></div></form><script>const q=document.getElementById('buscarCarpeta'),box=document.getElementById('resultadosCarpeta'),hid=document.getElementById('carpeta_id');let tm;q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(async()=>{const v=q.value.trim();if(v.length<2){box.innerHTML='';return;}const r=await fetch('{{url_for("prestamos.buscar_carpetas")}}?q='+encodeURIComponent(v));const d=await r.json();box.innerHTML=d.map(x=>`<button type="button" class="list-group-item list-group-item-action" data-id="${x.id}"><strong>Carpeta ${x.consecutivo}</strong> · ${x.nombre} · ${x.documento}</button>`).join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>{hid.value=b.dataset.id;q.value=b.textContent.trim();box.innerHTML='';});},250);});</script>{% endblock %}
