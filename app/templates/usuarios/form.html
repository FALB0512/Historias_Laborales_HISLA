{% extends 'base.html' %}{% block content %}<h2>{{'Editar' if usuario else 'Nuevo'}} usuario</h2><form method="post" class="card">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="card-body row g-3"><div class="col-md-5"><input class="form-control" name="nombre" value="{{usuario.nombre if usuario else ''}}" placeholder="Nombre" required></div>{% if not usuario %}<div class="col-md-3"><input class="form-control" name="username" placeholder="Usuario" required></div>{% endif %}<div class="col-md-4"><input class="form-control" type="email" name="email" value="{{usuario.email if usuario else ''}}" placeholder="Correo" required></div><div class="col-md-4"><select class="form-select" name="rol">{% for r in roles %}<option value="{{r}}" {% if usuario and usuario.rol==r %}selected{% endif %}>{{r|upper}}</option>{% endfor %}</select></div>{% if not usuario %}<div class="col-md-4"><input class="form-control" type="password" name="password" placeholder="Contraseña temporal" required></div>{% endif %}<div><button class="btn btn-primary">Guardar</button></div></div></form>{% endblock %}
