{% extends 'base.html' %}{% block content %}<h2>{{'Editar persona' if persona else 'Nueva persona'}}</h2><form method="post" class="card"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="card-body row g-3"><div class="col-md-3"><label class="form-label">Tipo documento</label><select class="form-select" name="tipo_documento_id" required>{% for x in tipos %}<option value="{{x.id}}" {% if persona and persona.tipo_documento_id==x.id %}selected{% endif %}>{{x.codigo}} - {{x.nombre}}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Identificación</label><input class="form-control" name="numero_documento" value="{{persona.numero_documento if persona else ''}}" required></div><div class="col-md-6"><label class="form-label">Nombre completo</label><input class="form-control" name="nombre_completo" value="{{persona.nombre_completo if persona else ''}}" required></div><div class="col-12"><button class="btn btn-primary">Guardar</button> <a class="btn btn-light" href="{{url_for('historias.ver',id=persona.id) if persona else url_for('historias.listar')}}">Cancelar</a></div></div></form>{% endblock %}
