{% extends 'base.html' %}{% block content %}<h2>{{'Editar carpeta' if carpeta else 'Nueva carpeta física'}}</h2><p class="text-muted">Persona: <strong>{{persona.nombre_completo}}</strong> · {{persona.numero_documento}}</p><form method="post" class="card"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><div class="card-body row g-3"><div class="col-md-3"><label class="form-label">Consecutivo</label><input class="form-control" type="number" min="1" name="consecutivo_carpeta" value="{{carpeta.consecutivo_carpeta if carpeta else ''}}" {% if carpeta %}readonly{% endif %} required></div><div class="col-md-3"><label class="form-label">Fecha ingreso</label><input class="form-control" type="date" name="fecha_ingreso" value="{{carpeta.fecha_ingreso.isoformat() if carpeta else ''}}" required></div><div class="col-md-3"><label class="form-label">Centro</label><select class="form-select" name="centro_id" required>{% for x in centros %}<option value="{{x.id}}" {% if carpeta and carpeta.centro_id==x.id %}selected{% endif %}>{{x.nombre}}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Unidad</label><select class="form-select" name="unidad_conservacion_id" required>{% for x in unidades %}<option value="{{x.id}}" {% if carpeta and carpeta.unidad_conservacion_id==x.id %}selected{% endif %}>{{x.nombre}}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">Estado</label><select class="form-select" name="estado"><option value="activo" {% if not carpeta or carpeta.estado=='activo' %}selected{% endif %}>Activo</option><option value="retirado" {% if carpeta and carpeta.estado=='retirado' %}selected{% endif %}>Retirado</option></select></div><div class="col-12"><button class="btn btn-primary">Guardar</button> <a class="btn btn-light" href="{{url_for('historias.ver',id=persona.id)}}">Cancelar</a></div></div></form>{% endblock %}
