{% extends 'base.html' %}{% block content %}
<div class="auth-card card"><div class="card-body">
<h2>Cambio obligatorio de contraseña</h2>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<input class="form-control mb-3" type="password" name="password" placeholder="Nueva contraseña" required>
<input class="form-control mb-3" type="password" name="confirmar" placeholder="Confirmar contraseña" required>
<button class="btn btn-primary">Actualizar</button>
</form></div></div>{% endblock %}
